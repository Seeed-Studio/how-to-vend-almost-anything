name: Refresh FabLabs directory

on:
  schedule:
    - cron: "15 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fablabs-directory
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Test directory normalization
        run: node --test scripts/fetch-fablabs-directory.test.mjs scripts/network.test.mjs

      - name: Fetch public directory snapshot
        run: node scripts/fetch-fablabs-directory.mjs

      - name: Validate site data
        run: node scripts/validate-site-data.mjs

      - name: Commit snapshot when the directory changed
        run: |
          git add docs/en/data/directory-labs.json docs/ch/data/directory-labs.json
          if git diff --cached --quiet; then
            echo "No directory changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Keep lab discovery aligned with the public directory" -m "Confidence: high" -m "Scope-risk: narrow" -m "Tested: Directory regression tests and site data validation"
          git push
